<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>رُكن OS | إدارة الأثاث</title><style>:root{font-family:system-ui,Tahoma;background:#f6f7f9;color:#202b35}*{box-sizing:border-box}body{margin:0}header{background:#142b35;color:white;padding:20px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px}header strong{font-size:23px}main{max-width:1180px;margin:auto;padding:24px 16px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 24px}button,.btn{border:0;background:#e7ecee;color:#19343d;padding:11px 16px;border-radius:11px;cursor:pointer;font:inherit}button.active,.primary{background:#167e76;color:white}button:hover{filter:brightness(.96)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:14px}.card,.panel{background:white;border:1px solid #e5e8ea;border-radius:16px;padding:20px;box-shadow:0 3px 12px #152c3508}.card b{display:block;font-size:28px;margin:8px 0}.muted{color:#74818a;font-size:13px}.panel{margin-top:20px;overflow:auto}h2{font-size:20px;margin:0 0 16px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}input,select,textarea{border:1px solid #dbe0e4;border-radius:10px;padding:12px;font:inherit;max-width:100%;background:white}input[type=search]{min-width:240px}table{border-collapse:collapse;width:100%;min-width:720px}th,td{text-align:right;padding:12px;border-bottom:1px solid #eef0f2;font-size:14px}th{color:#73808a;font-weight:600;background:#f9fafb}.tag{display:inline-block;background:#eef5f4;padding:5px 9px;border-radius:20px;font-size:12px}.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.product{border:1px solid #e7e9eb;border-radius:14px;overflow:hidden;background:white}.art{height:135px;background:linear-gradient(145deg,#e4e0d8,#f7f4ef);display:grid;place-items:center;font-size:46px}.product>div:last-child{padding:14px}dialog{border:0;border-radius:18px;padding:24px;width:min(540px,95vw);box-shadow:0 20px 70px #0004}dialog::backdrop{background:#11232c8c}form{display:grid;gap:12px}form label{display:grid;gap:5px;font-size:13px;color:#55636d}form input,form select{width:100%}.row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}.hidden{display:none!important}.notice{background:#fff6e6;padding:12px;border-radius:12px;color:#795b26;font-size:13px;margin-top:14px}@media(max-width:600px){header{padding:16px}main{padding:16px 10px}input[type=search]{min-width:0;width:100%}.toolbar{align-items:stretch}.toolbar>*{flex:1}}</style></head><body><header><strong>رُكن <small style="font-size:13px;color:#b2d6d2">OS</small></strong><span>إدارة الطلبات والمخزون</span></header><main><nav id="nav"><button class="active" data-tab="dashboard">الرئيسية</button><button data-tab="orders">الطلبيات</button><button data-tab="products">المنتجات</button><button data-tab="stock">المخزون</button><button data-tab="delivery">التوصيل</button></nav><section id="dashboard"><div class="cards" id="stats"></div><div class="panel"><h2>آخر الطلبيات</h2><div id="recent"></div></div></section><section id="orders" class="hidden"><div class="panel"><div class="toolbar"><h2>كل الطلبيات</h2><input id="search" type="search" placeholder="بحث بالاسم أو الهاتف أو المنتج"><button class="primary" onclick="openForm()">+ طلب جديد</button></div><div id="orderTable"></div></div></section><section id="products" class="hidden"><div class="panel"><h2>كتالوج المنتجات</h2><div class="products" id="catalog"></div></div></section><section id="stock" class="hidden"><div class="panel"><h2>المخزون المتوفر</h2><div id="stockTable"></div></div></section><section id="delivery" class="hidden"><div class="panel"><h2>طلبات التوصيل</h2><div id="deliveryTable"></div></div></section><p class="notice">نسخة تجريبية: البيانات محفوظة في هذا المتصفح فقط، ولا تتزامن بين الأجهزة. الصور رمزية إلى حين رفع صور المنتجات الحقيقية.</p></main><dialog id="dlg"><h2 id="formTitle">إضافة طلب</h2><form id="orderForm"><input type="hidden" name="id"><label>اسم الزبون<input name="name" required></label><label>رقم الهاتف<input name="phone" inputmode="tel"></label><label>المدينة / العنوان<input name="city"></label><label>المنتج<select name="product" id="productSelect"></select></label><label>اللون<select name="color"><option>أبيض</option><option>خشبي</option><option>رخامي</option><option>بيج</option><option>غير محدد</option></select></label><label>الحالة<select name="status"><option>جديد</option><option>مؤكد</option><option>للمصنع</option><option>قيد التصنيع</option><option>جاهز</option><option>في التوصيل</option><option>تم التسليم</option></select></label><label>السعر بالدينار<input name="price" type="number" min="0"></label><label>ملاحظات<input name="notes"></label><div class="row"><button type="button" onclick="dlg.close()">إلغاء</button><button class="primary" type="submit">حفظ الطلب</button></div></form></dialog><script>
const products=[['مدخل معلق','🪞'],['مدخل حرف U','🏛️'],['طاولة تلفزيون','📺'],['طاولة مربعة','🛋️'],['طاولة صالون','🪑']];
const seed=[['مالك','0919400844','الهضبة البدري','مدخل معلق','أبيض','في التوصيل',575],['أم سند','0914367970','طريق المطار','مدخل معلق','خشبي','في التوصيل',550],['علي حسن','0910541700','تاجوراء','مدخل معلق','أبيض','في التوصيل',600],['زوهور','0915477481','عين زارة','طاولة تلفزيون','خشبي','في التوصيل',350],['عمر الشريعة','0915558677','طريق المطار','مدخل معلق','خشبي','في التوصيل',580],['شاريفة','0910805519','طرابلس','طاولة تلفزيون','خشبي','في التوصيل',395],['سارة قرجي','0917257936','قرجي','مدخل معلق','بيج','في التوصيل',600],['عزت الماضي','0913869908','رقدالين','مدخل معلق','أبيض','مؤكد',0],['عزت الماضي','0913869908','رقدالين','طاولة تلفزيون','أبيض','مؤكد',0],['طلب الفرناج','0915173832','الفرناج','مدخل معلق','أبيض','جديد',0],['مختار وادي','0927164721','السواني','مدخل معلق','أبيض','جديد',0],['إبراهيم النعمي','0921414319','خلة الفرجان','مدخل معلق','أبيض','جديد',0],['أكرم المصراتي','0926193933','تاجوراء','مدخل معلق','أبيض','جديد',0],['محمد خليل','0911949012','مشروع الهضبة','مدخل معلق','أبيض','جديد',0],['سالم مفتاح','0944153972','بني وليد','مدخل حرف U','خشبي','مؤكد',0],['أم فيروز','0945818516','شحات','مدخل حرف U','خشبي','جديد',1150],['أم محمد','0913127653','السبعة','مدخل حرف U','خشبي','جديد',0],['أم محمد','0913127653','السبعة','طاولة مربعة','غير محدد','جديد',0],['أم محمد','0913127653','السبعة','طاولة مربعة','غير محدد','جديد',0],['المهدي الغزالي','0920808614','بنغازي','مدخل حرف U','خشبي','جديد',0],['أحمد غميقة','0914612976','ورشفانة','مدخل حرف U','رخامي','مؤكد',1150],['إسراء مصراتة','0925503978','مصراتة','مدخل حرف U','رخامي','جديد',0],['خليفة','0911457604','عين زارة','طاولة مربعة','غير محدد','مؤكد',0],['زهراء','','','مدخل حرف U','خشبي','جديد',0],['زهراء','','','طاولة مربعة','غير محدد','جديد',0],['زهراء','','','طاولة مربعة','غير محدد','جديد',0],['عمر مصراتة','0915200022','مصراتة','مدخل حرف U','رخامي','جديد',1600],['عمر مصراتة','0915200022','مصراتة','طاولة صالون','غير محدد','جديد',0]];
const initial=seed.map((x,i)=>({id:i+1,name:x[0],phone:x[1],city:x[2],product:x[3],color:x[4],status:x[5],price:x[6],notes:''}));
let orders;try{orders=JSON.parse(localStorage.getItem('rokn_orders'))||initial}catch{orders=initial}
const stock=[['مدخل معلق','أبيض',1],['مدخل معلق','خشبي',4],['مدخل معلق','بيج',1],['مراية مدخل معلق','قياسي',9],['طاولة تلفزيون','أبيض',2],['طاولة تلفزيون','خشبي',1],['مدخل حرف U','خشبي (إنتاج مخطط)',3],['مدخل حرف U','رخامي (إنتاج مخطط)',7],['طاولة مربعة','إنتاج مخطط',4]];
const save=()=>localStorage.setItem('rokn_orders',JSON.stringify(orders));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>n?Number(n).toLocaleString('ar-LY')+' د.ل':'—';
function table(items,actions=false){return '<table><thead><tr><th>الزبون</th><th>الهاتف</th><th>المنتج</th><th>اللون</th><th>الحالة</th><th>السعر</th>'+(actions?'<th>إجراء</th>':'')+'</tr></thead><tbody>'+items.map(o=>'<tr><td>'+esc(o.name)+'<div class="muted">'+esc(o.city)+'</div></td><td>'+esc(o.phone)+'</td><td>'+esc(o.product)+'</td><td>'+esc(o.color)+'</td><td><span class="tag">'+esc(o.status)+'</span></td><td>'+money(o.price)+'</td>'+(actions?'<td><button onclick="openForm('+o.id+')">تعديل</button></td>':'')+'</tr>').join('')+'</tbody></table>'}
function render(){const unique=new Set(orders.map(o=>o.phone||o.name));const counts=[['الزبائن',unique.size],['القطع المطلوبة',orders.filter(o=>o.status!=='تم التسليم').length],['المؤكدة',orders.filter(o=>o.status==='مؤكد').length],['في التوصيل',orders.filter(o=>o.status==='في التوصيل').length]];stats.innerHTML=counts.map(([a,b])=>'<div class="card"><span class="muted">'+a+'</span><b>'+b+'</b></div>').join('');recent.innerHTML=table(orders.slice(-8).reverse());const q=search.value.trim().toLowerCase();orderTable.innerHTML=table(orders.filter(o=>[o.name,o.phone,o.product,o.city].join(' ').toLowerCase().includes(q)),true);deliveryTable.innerHTML=table(orders.filter(o=>o.status==='في التوصيل'));stockTable.innerHTML='<table><tr><th>الصنف</th><th>اللون / النوع</th><th>الكمية</th></tr>'+stock.map(x=>'<tr><td>'+x[0]+'</td><td>'+x[1]+'</td><td>'+x[2]+'</td></tr>').join('')+'</table>';catalog.innerHTML=products.map(([p,emoji])=>'<article class="product"><div class="art">'+emoji+'</div><div><b>'+p+'</b><p class="muted">اختر المنتج لإضافة طلب جديد</p><button class="primary" onclick="openForm(null,\''+p+'\')">+ طلب من المنتج</button></div></article>').join('')}
nav.addEventListener('click',e=>{const t=e.target.dataset.tab;if(!t)return;document.querySelectorAll('main>section').forEach(x=>x.classList.toggle('hidden',x.id!==t));document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));render()});search.oninput=render;productSelect.innerHTML=products.map(x=>'<option>'+x[0]+'</option>').join('');
function openForm(id=null,product=null){orderForm.reset();orderForm.elements.id.value='';formTitle.textContent='إضافة طلب';if(id!=null){const o=orders.find(x=>x.id===id);if(o){Object.keys(o).forEach(k=>{if(orderForm.elements[k])orderForm.elements[k].value=o[k]});formTitle.textContent='تعديل الطلب'}}if(product)productSelect.value=product;dlg.showModal()}
orderForm.onsubmit=e=>{e.preventDefault();const f=new FormData(orderForm);const id=Number(f.get('id'))||Date.now();const o={id,name:f.get('name'),phone:f.get('phone'),city:f.get('city'),product:f.get('product'),color:f.get('color'),status:f.get('status'),price:Number(f.get('price'))||0,notes:f.get('notes')};const i=orders.findIndex(x=>x.id===id);if(i>=0)orders[i]=o;else orders.push(o);save();dlg.close();render()};render();
</script></body></html>
